name = "jacobhart-status-api"
main = "src/entry.py"
compatibility_date = "2026-10-13"
compatibility_flags = ["python_workers"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[[unsafe.bindings]]
name = "STATUS_API"
type = "service"
service = "jacobhart-me-status"
environment = "production"
